<script>
const el = id => document.getElementById(id);
let bufA = null, bufB = null, diffOffsets = [];
let modelA = null, modelB = null; // cấu trúc Unity SerializedFile (nếu nhận diện được)

/* ═══════════ typetree reader ═══════════
   Đọc header + metadata + typetree của file Unity SerializedFile (asset/bundle đã giải nén),
   để có thể quy đổi offset byte thay đổi -> tên field thực sự thay vì chỉ hex thô.
   Toàn bộ khối này được bọc try/catch ở nơi gọi: nếu file không phải SerializedFile hợp lệ
   (hoặc có phiên bản/định dạng chưa hỗ trợ), công cụ tự động rơi về chế độ so sánh hex thuần
   như bản gốc — không văng lỗi, không chặn luồng chính. */

function enc(s){ return new TextEncoder().encode(s); }

const COMMON = "AABB\0AnimationClip\0AnimationCurve\0AnimationState\0Array\0Base\0BitField\0bitset\0bool\0char\0ColorRGBA\0Component\0data\0deque\0double\0dynamic_array\0FastPropertyName\0first\0float\0Font\0GameObject\0Generic Mono\0GradientNEW\0GUID\0GUIStyle\0int\0list\0long long\0map\0Matrix4x4f\0MdFour\0MonoBehaviour\0MonoScript\0m_ByteSize\0m_Curve\0m_EditorClassIdentifier\0m_EditorHideFlags\0m_Enabled\0m_ExtensionPtr\0m_GameObject\0m_Index\0m_IsArray\0m_IsStatic\0m_MetaFlag\0m_Name\0m_ObjectHideFlags\0m_PrefabInternal\0m_PrefabParentObject\0m_Script\0m_StaticEditorFlags\0m_Type\0m_Version\0Object\0pair\0PPtr<Component>\0PPtr<GameObject>\0PPtr<Material>\0PPtr<MonoBehaviour>\0PPtr<MonoScript>\0PPtr<Object>\0PPtr<Prefab>\0PPtr<Sprite>\0PPtr<TextAsset>\0PPtr<Texture>\0PPtr<Texture2D>\0PPtr<Transform>\0Prefab\0Quaternionf\0Rectf\0RectInt\0RectOffset\0second\0set\0short\0size\0SInt16\0SInt32\0SInt64\0SInt8\0staticvector\0string\0TextAsset\0TextMesh\0Texture\0Texture2D\0Transform\0TypelessData\0UInt16\0UInt32\0UInt64\0UInt8\0unsigned int\0unsigned long long\0unsigned short\0vector\0Vector2f\0Vector3f\0Vector4f\0m_ScriptingClassIdentifier\0Gradient\0Type*\0int2_storage\0int3_storage\0BoundsInt\0m_CorrespondingSourceObject\0m_PrefabInstance\0m_PrefabAsset\0FileSize\0Hash128\0";
const COMMON_B = enc(COMMON);

// Bảng tên lớp (ClassID) thường gặp — chỉ để hiển thị cho dễ đọc, không cần đầy đủ 100%.
const CLASS_NAMES = {
  0:'Object',1:'GameObject',2:'Component',4:'Transform',8:'Behaviour',9:'GameManager',
  11:'AudioManager',12:'ParticleAnimator',13:'InputManager',18:'EllipsoidParticleEmitter',
  20:'Camera',21:'Material',23:'MeshRenderer',25:'Renderer',26:'ParticleRenderer',27:'Texture',
  28:'Texture2D',30:'SceneSettings',33:'MeshFilter',41:'OcclusionPortal',43:'Mesh',
  45:'Skybox',47:'QualitySettings',48:'Shader',49:'TextAsset',50:'Rigidbody2D',53:'Collider2D',
  54:'Rigidbody',56:'Collider',57:'Joint',58:'CircleCollider2D',59:'HingeJoint',60:'PolygonCollider2D',
  61:'BoxCollider2D',62:'PhysicsMaterial2D',64:'MeshCollider',65:'BoxCollider',68:'CapsuleCollider',
  72:'PhysicMaterial',74:'AnimationClip',75:'ConstantForce',78:'TagManager',81:'AudioListener',
  82:'AudioSource',83:'AudioClip',84:'RenderTexture',87:'MeshParticleEmitter',89:'Cubemap',
  90:'Avatar',91:'AnimatorController',93:'RuntimeAnimatorController',95:'Animator',96:'TrailRenderer',
  98:'DelayedCallManager',102:'TextMesh',104:'RenderSettings',108:'Light',109:'CGProgram',
  110:'BaseAnimationTrack',111:'Animation',114:'MonoBehaviour',115:'MonoScript',
  117:'MonoManager',119:'Texture3D',120:'NewAnimationTrack',121:'Projector',122:'LineRenderer',
  123:'Flare',124:'Halo',125:'LensFlare',126:'FlareLayer',128:'Font',129:'PlayerSettings',
  131:'GUITexture',134:'PhysicsManager',135:'SphereCollider',136:'CapsuleCollider',
  137:'SkinnedMeshRenderer',138:'FixedJoint',141:'BuildSettings',142:'AssetBundle',
  143:'CharacterController',144:'CharacterJoint',145:'SpringJoint',146:'WheelCollider',
  147:'ResourceManager',150:'PreloadData',153:'AnimatorStateTransition',154:'AnimatorState',
  156:'TerrainCollider',157:'TerrainData',158:'LightmapSettings',159:'WebCamTexture',
  180:'AudioReverbFilter',182:'AudioSourceFilter',183:'AudioChorusFilter',184:'AudioReverbZone',
  185:'AudioEchoFilter',186:'AudioLowPassFilter',187:'AudioHighPassFilter',188:'AudioDistortionFilter',
  191:'AnimatorStateMachine',193:'CanvasRenderer',194:'Canvas',195:'RectTransform',
  198:'ParticleSystem',199:'ParticleSystemRenderer',200:'ShaderVariantCollection',
  205:'LODGroup',206:'BlendTree',207:'Motion',213:'SpriteRenderer',
  212:'Sprite',221:'ReflectionProbe',222:'ReflectionProbes',223:'Terrain',
  224:'LightProbeGroup',225:'AnimatorOverrideController',226:'CanvasGroup',
  241:'AnimatorTransition',258:'ScriptMapper',272:'AudioMixer',273:'AudioMixerController',
  1001:'PrefabInstance',1032:'AssetImportInProgressProxy'
};

const ALIGN_FLAG = 0x4000;
const PRIM_SIZES = {
  bool:1, char:1, SInt8:1, UInt8:1, 'unsigned char':1,
  SInt16:2, short:2, UInt16:2, 'unsigned short':2,
  SInt32:4, int:4, UInt32:4, 'unsigned int':4, float:4, 'Type*':4,
  SInt64:8, 'long long':8, UInt64:8, 'unsigned long long':8, double:8, FileSize:8
};

class BinReader {
  constructor(buf){ this.buf = buf; this.view = new DataView(buf.buffer, buf.byteOffset, buf.byteLength); this.pos = 0; this.le = false; }
  align(n){ const r = this.pos % n; if (r) this.pos += (n - r); }
  u8(){ const v = this.view.getUint8(this.pos); this.pos += 1; return v; }
  u16(){ const v = this.view.getUint16(this.pos, this.le); this.pos += 2; return v; }
  i16(){ const v = this.view.getInt16(this.pos, this.le); this.pos += 2; return v; }
  u32(){ const v = this.view.getUint32(this.pos, this.le); this.pos += 4; return v; }
  i32(){ const v = this.view.getInt32(this.pos, this.le); this.pos += 4; return v; }
  u64(){ const v = this.view.getBigUint64(this.pos, this.le); this.pos += 8; return v; }
  i64(){ const v = this.view.getBigInt64(this.pos, this.le); this.pos += 8; return v; }
  skip(n){ this.pos += n; }
  bytes(n){ const v = this.buf.subarray(this.pos, this.pos + n); this.pos += n; return v; }
  cstr(){ let s = this.pos; while (this.buf[s] !== 0) s++; const str = new TextDecoder().decode(this.buf.subarray(this.pos, s)); this.pos = s + 1; return str; }
}

function cstrAt(buf, off) {
  if (off < 0 || off >= buf.length) return '';
  let e = off; while (e < buf.length && buf[e] !== 0) e++;
  return new TextDecoder().decode(buf.subarray(off, e));
}

function readTypeTreeBlob(r, h) {
  const numNodes = r.i32();
  const strBufSize = r.i32();
  if (numNodes < 0 || numNodes > 200000 || strBufSize < 0 || strBufSize > r.buf.length) throw new Error('typetree size bất thường');
  const nodes = [];
  for (let i = 0; i < numNodes; i++) {
    const n = {};
    n.version = r.u16();
    n.level = r.u8();
    n.typeFlags = r.u8();
    n.typeOffset = r.u32();
    n.nameOffset = r.u32();
    n.byteSize = r.i32();
    n.index = r.i32();
    n.metaFlag = r.i32();
    if (h.version >= 19) n.refHash = r.u64();
    nodes.push(n);
  }
  const strBuf = r.bytes(strBufSize);
  const resolve = (off) => {
    const isCommon = (off & 0x80000000) !== 0;
    const real = off & 0x7fffffff;
    return isCommon ? cstrAt(COMMON_B, real) : cstrAt(strBuf, real);
  };
  for (const n of nodes) { n.type = resolve(n.typeOffset); n.name = resolve(n.nameOffset); }
  return nodes;
}

function readSerializedType(r, h, enableTypeTree) {
  const t = {};
  t.classID = r.i32();
  if (h.version >= 16) t.isStrippedType = r.u8() !== 0;
  t.scriptTypeIndex = -1;
  if (h.version >= 17) t.scriptTypeIndex = r.i16();
  if (h.version >= 13) {
    if ((h.version < 16 && t.classID < 0) || (h.version >= 16 && t.classID === 114)) t.scriptID = r.bytes(16);
    t.oldTypeHash = r.bytes(16);
  }
  if (enableTypeTree) {
    if (h.version >= 12 || h.version === 10) t.nodes = readTypeTreeBlob(r, h);
    else t.nodes = null; // định dạng cây kiểu đệ quy cũ (<v10) — chưa hỗ trợ, sẽ fallback hex
    if (h.version >= 21) { const depCount = r.i32(); if (depCount > 0 && depCount < 100000) r.skip(depCount * 4); }
  }
  return t;
}

function readHeader(r) {
  r.le = false; // header luôn big-endian
  const h = {};
  h.metadataSize = r.u32();
  h.fileSize = r.u32();
  h.version = r.u32();
  h.dataOffset = r.u32();
  h.endianess = 0;
  if (h.version >= 9) { h.endianess = r.u8(); r.skip(3); }
  if (h.version >= 22) {
    h.metadataSize = r.u32();
    h.fileSize = Number(r.u64());
    h.dataOffset = Number(r.u64());
    r.u64();
  }
  return h;
}

function readMetadata(r, h) {
  const types = [];
  if (h.version >= 7) r.cstr(); // unityVersion
  if (h.version >= 8) r.i32(); // targetPlatform
  let enableTypeTree = true;
  if (h.version >= 13) enableTypeTree = r.u8() !== 0;
  const typeCount = r.i32();
  if (typeCount < 0 || typeCount > 100000) throw new Error('typeCount bất thường');
  for (let i = 0; i < typeCount; i++) types.push(readSerializedType(r, h, enableTypeTree));

  const objectCount = r.i32();
  if (objectCount < 0 || objectCount > 5000000) throw new Error('objectCount bất thường');
  const objects = [];
  for (let i = 0; i < objectCount; i++) {
    if (h.version >= 14) r.align(4);
    const pathId = h.version >= 14 ? r.i64() : BigInt(r.i32());
    let byteStart = h.version >= 22 ? Number(r.i64()) : r.u32();
    byteStart += h.dataOffset;
    const byteSize = r.u32();
    const typeID = r.i32();
    let classID, sType;
    if (h.version < 16) { classID = r.u16(); sType = types.find(t => t.classID === classID); }
    else { sType = types[typeID]; classID = sType ? sType.classID : -1; }
    if (h.version < 11) r.u16();
    if (h.version >= 11 && h.version < 17) r.i16();
    if (h.version === 15 || h.version === 16) r.u8();
    objects.push({ pathId, byteStart, byteSize, typeID, classID, type: sType });
  }
  return { types, objects, enableTypeTree };
}

function safeParseUnity(buf) {
  try {
    if (!buf || buf.length < 20) return null;
    const r = new BinReader(buf);
    const h = readHeader(r);
    if (h.version < 6 || h.version > 30) return null; // ngoài phạm vi hỗ trợ -> không phải file nhận diện được
    if (h.metadataSize <= 0 || h.dataOffset < 0 || h.dataOffset > buf.length) return null;
    r.le = (h.endianess === 0);
    const meta = readMetadata(r, h);
    return { header: h, ...meta };
  } catch (e) {
    return null; // tránh lỗi vặt: file không đúng định dạng thì âm thầm rơi về chế độ hex thuần
  }
}

// Đi bộ typetree thực để tính offset thật của từng field lá trong 1 object cụ thể.
function walkFields(r, nodes, idx, level, pathPrefix, leaves, guard) {
  if (guard.n++ > 400000) throw new Error('typetree quá sâu/lặp bất thường');
  const node = nodes[idx];
  const start = r.pos;
  let i = idx + 1;
  const children = [];
  while (i < nodes.length && nodes[i].level > level) { if (nodes[i].level === level + 1) children.push(i); i++; }
  const endIdx = i;
  const name = pathPrefix ? pathPrefix + '.' + node.name : node.name;

  if (node.type === 'string') {
    const size = r.i32();
    r.skip(size);
    leaves.push({ path: name, start, end: r.pos, type: 'string' });
  } else if (node.type === 'Array' || (children.length && nodes[children[0]].type === 'Array')) {
    const arrIdx = node.type === 'Array' ? idx : children[0];
    walkArrayNode(r, nodes, arrIdx, name, leaves, guard);
  } else if (children.length === 0) {
    const size = PRIM_SIZES[node.type] ?? (node.byteSize > 0 ? node.byteSize : 4);
    const fStart = r.pos;
    r.skip(size);
    leaves.push({ path: name, start: fStart, end: r.pos, type: node.type });
  } else {
    for (const c of children) walkFields(r, nodes, c, level + 1, name, leaves, guard);
  }
  if (node.metaFlag & ALIGN_FLAG) r.align(4);
  return endIdx;
}

function walkArrayNode(r, nodes, arrIdx, name, leaves, guard) {
  const arrNode = nodes[arrIdx];
  const level = arrNode.level;
  let i = arrIdx + 1; const children = [];
  while (i < nodes.length && nodes[i].level > level) { if (nodes[i].level === level + 1) children.push(i); i++; }
  const sizeStart = r.pos;
  const count = r.i32();
  leaves.push({ path: name + '.size', start: sizeStart, end: r.pos, type: 'int' });
  if (count < 0 || count > 2000000) throw new Error('array size bất thường');
  const dataIdx = children[children.length - 1];
  if (dataIdx !== undefined) {
    for (let k = 0; k < count; k++) walkFields(r, nodes, dataIdx, nodes[dataIdx].level, name + '[' + k + ']', leaves, guard);
  }
  if (arrNode.metaFlag & ALIGN_FLAG) r.align(4);
}

function findObject(model, offset) {
  if (!model) return null;
  if (!model._sorted) model._sorted = [...model.objects].sort((a, b) => a.byteStart - b.byteStart);
  for (const o of model._sorted) { if (offset >= o.byteStart && offset < o.byteStart + o.byteSize) return o; }
  return null;
}

// Trả về mô tả field ứng với 1 offset byte cụ thể trong buf (dùng model đã parse của chính buf đó).
function describeOffset(model, buf, offset) {
  const obj = findObject(model, offset);
  if (!obj) return null;
  const typeName = CLASS_NAMES[obj.classID] || ('ClassID ' + obj.classID);
  let fieldPath = null;
  if (obj.type && obj.type.nodes && obj.type.nodes.length) {
    try {
      if (!obj._leaves) {
        const r = new BinReader(buf);
        r.le = (model.header.endianess === 0);
        r.pos = obj.byteStart;
        const leaves = [];
        walkFields(r, obj.type.nodes, 0, 0, '', leaves, { n: 0 });
        obj._leaves = leaves;
      }
      for (const f of obj._leaves) { if (offset >= f.start && offset < f.end) { fieldPath = f.path; break; } }
    } catch (e) { /* bỏ qua, không có field-level detail cho object này */ }
  }
  return { pathId: obj.pathId.toString(), classID: obj.classID, typeName, fieldPath };
}
/* ═══════════ /typetree reader ═══════════ */

function wireSlot(dropId, inputId, labelId, slot) {
  el(dropId).addEventListener('click', () => el(inputId).click());
  el(inputId).addEventListener('change', e => { const f = e.target.files[0]; if (f) loadFile(f, slot, labelId); });
  ['dragover','dragleave','drop'].forEach(ev => el(dropId).addEventListener(ev, e => {
    e.preventDefault();
    el(dropId).classList.toggle('over', ev === 'dragover');
    if (ev === 'drop' && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0], slot, labelId);
  }));
}
wireSlot('dropA','fileA','labelA','A');
wireSlot('dropB','fileB','labelB','B');

async function loadFile(f, slot, labelId) {
  const buf = new Uint8Array(await f.arrayBuffer());
  if (slot === 'A') bufA = { buf, name: f.name }; else bufB = { buf, name: f.name };
  el(labelId).textContent = `${f.name} — ${buf.length.toLocaleString('vi-VN')} byte`;
  const ready = bufA && bufB;
  el('runBtn').disabled = !ready;
  if(!ready) el('patchBtn').disabled = true;
}

el('runBtn').addEventListener('click', runDiff);
el('patchBtn').addEventListener('click', generatePatchedFile);

function runDiff() {
  const a = bufA.buf, b = bufB.buf;
  const minLen = Math.min(a.length, b.length);
  diffOffsets = [];
  let firstDiff = -1;
  for (let i = 0; i < minLen; i++) {
    if (a[i] !== b[i]) {
      diffOffsets.push(i);
      if (firstDiff < 0) firstDiff = i;
    }
  }
  const sizeDiff = a.length - b.length;
  const identical = diffOffsets.length === 0 && sizeDiff === 0;

  // Thử nhận diện cấu trúc Unity SerializedFile ở cả 2 file — không bắt buộc, chỉ để làm giàu hiển thị.
  modelA = safeParseUnity(a);
  modelB = safeParseUnity(b);

  let statusHtml;
  if (identical) {
    statusHtml = `<div class="msg ok">Hai file GIỐNG HỆT NHAU — Không có thông số nào thay đổi.</div>`;
    el('patchBtn').disabled = true;
  } else {
    statusHtml = `<div class="msg bad">Phát hiện ${diffOffsets.length.toLocaleString('vi-VN')} byte khác biệt${sizeDiff !== 0 ? `, chênh lệch kích thước ${Math.abs(sizeDiff).toLocaleString('vi-VN')} byte` : ''}. Sẵn sàng import thông số!</div>`;
    el('patchBtn').disabled = false;
  }
  if (modelA) {
    const hasTree = modelA.objects.some(o => o.type && o.type.nodes && o.type.nodes.length);
    statusHtml += `<div class="msg warn">Đã nhận diện File A là Unity SerializedFile (version ${modelA.header.version}, ${modelA.objects.length.toLocaleString('vi-VN')} object). ${hasTree ? 'Có TypeTree — bảng bên dưới sẽ hiện tên field thật.' : 'Không có TypeTree nhúng sẵn — chỉ hiện theo Object/ClassID, không có tên field.'}</div>`;
  } else {
    statusHtml += `<div class="msg warn">Không nhận diện được cấu trúc Unity ở File A — dùng chế độ so sánh hex thuần.</div>`;
  }
  el('status').innerHTML = statusHtml;

  if (identical) { el('result').innerHTML = ''; return; }

  const pctDiff = minLen ? (diffOffsets.length / minLen * 100) : 0;
  el('result').innerHTML = `
    <div class="stat-grid">
      <div class="stat ${diffOffsets.length ? 'bad' : ''}"><b>${diffOffsets.length.toLocaleString('vi-VN')}</b><span>Byte khác biệt</span></div>
      <div class="stat"><b>${firstDiff >= 0 ? '0x'+firstDiff.toString(16) : '—'}</b><span>Offset thay đổi đầu</span></div>
      <div class="stat"><b>${pctDiff.toFixed(3)}%</b><span>Tỉ lệ thay đổi</span></div>
      <div class="stat"><b>${sizeDiff === 0 ? 'Bằng nhau' : (sizeDiff>0?'A > B':'B > A')}</b><span>Trạng thái size</span></div>
    </div>

    <div class="panel">
      <h2>
        <span>Hex tại vùng thay đổi</span>
        <div class="nav" id="hexNav"></div>
      </h2>
      <div id="hexArea"></div>
    </div>

    <div class="panel">
      <h2>Danh sách các vùng thông số thay đổi (Sẽ được import từ B sang A)</h2>
      <table class="diffrows">
        <tr><th>Offset (hex)</th><th>Độ dài</th><th>Giá trị Gốc (A)</th><th>Giá trị Mới từ (B)</th><th>Field / Object</th></tr>
        <tbody id="diffRows"></tbody>
      </table>
    </div>
  `;

  renderRegions();
  renderHexAt(firstDiff);
}

function renderRegions() {
  const regions = [];
  let start = null, prev = null;
  for (const off of diffOffsets) {
    if (start === null) { start = off; prev = off; continue; }
    if (off === prev + 1) { prev = off; continue; }
    regions.push([start, prev]); start = off; prev = off;
  }
  if (start !== null) regions.push([start, prev]);

  const MAX_ROWS = 200;
  const rows = regions.slice(0, MAX_ROWS).map(([s,e]) => {
    const len = e - s + 1;
    const a = bytesToHex(bufA.buf.subarray(s, Math.min(e+1, s+8)));
    const b = bytesToHex(bufB.buf.subarray(s, Math.min(e+1, s+8)));
    let fieldCell = '<span class="off">—</span>';
    const desc = modelA ? describeOffset(modelA, bufA.buf, s) : null;
    if (desc) {
      fieldCell = `<span title="PathID ${desc.pathId}">${desc.typeName}${desc.fieldPath ? ' › ' + desc.fieldPath : ''}</span>`;
    }
    return `<tr onclick="renderHexAt(${s})" style="cursor:pointer">
      <td class="off">0x${s.toString(16).padStart(8,'0')}</td>
      <td>${len} byte</td>
      <td class="hex-a">${a}${len>8?' …':''}</td>
      <td class="hex-b">${b}${len>8?' …':''}</td>
      <td>${fieldCell}</td>
    </tr>`;
  }).join('');
  el('diffRows').innerHTML = rows + (regions.length > MAX_ROWS ? `<tr><td colspan="5" class="off">… và ${regions.length - MAX_ROWS} vùng khác</td></tr>` : '');
}

function bytesToHex(arr) {
  return Array.from(arr).map(b => b.toString(16).padStart(2,'0')).join(' ');
}

let hexCenter = 0;
function renderHexAt(offset) {
  hexCenter = offset;
  const WINDOW = 256;
  const start = Math.max(0, offset - 64);
  el('hexArea').innerHTML = `<div class="hexview">
    <div><div style="color:var(--muted);font:11px var(--mono);margin-bottom:6px">FILE A (Gốc) — ${bufA.name}</div><div class="hexbox" id="hexA"></div></div>
    <div><div style="color:var(--muted);font:11px var(--mono);margin-bottom:6px">FILE B (Nguồn Mod) — ${bufB.name}</div><div class="hexbox" id="hexB"></div></div>
  </div>`;
  renderHexBox('hexA', bufA.buf, start, WINDOW);
  renderHexBox('hexB', bufB.buf, start, WINDOW);
  el('hexNav').innerHTML = `<span>offset 0x${offset.toString(16)}</span>`;
}

function renderHexBox(id, buf, start, windowLen) {
  const diffSet = new Set(diffOffsets);
  let html = '';
  for (let row = start; row < Math.min(buf.length, start + windowLen); row += 16) {
    let line = `<span class="addr">${row.toString(16).padStart(8,'0')}</span> `;
    for (let i = 0; i < 16; i++) {
      const p = row + i;
      if (p >= buf.length) { line += `<span class="byte">  </span> `; continue; }
      const isDiff = diffSet.has(p);
      line += `<span class="byte${isDiff?' diff':''}">${buf[p].toString(16).padStart(2,'0')}</span> `;
    }
    html += `<div class="row">${line}</div>`;
  }
  el(id).innerHTML = html;
}

// Tính năng Patcher: Lấy dữ liệu từ file gốc A, chép đè các byte khác biệt từ file B và cho phép tải xuống
function generatePatchedFile() {
  if (!bufA || !bufB) return;

  // Clone lại buffer của file gốc A để giữ nguyên toàn bộ cấu trúc gốc
  const newBuf = new Uint8Array(bufA.buf);
  
  // Chép đè (patch) tất cả các byte từ file B sang file A dựa trên mảng vị trí khác biệt đã check
  let patchedCount = 0;
  for (const i of diffOffsets) {
    if (i < newBuf.length && i < bufB.buf.length) {
      newBuf[i] = bufB.buf[i];
      patchedCount++;
    }
  }

  // Xử lý trường hợp file B dài hơn file A (nếu có phần dư thừa ở đuôi)
  // Tạo Blob và kích hoạt tải xuống tự động
  const blob = new Blob([newBuf], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  
  // Tên tải xuống giữ nguyên tuyệt đối tên của File A (File Gốc).
  const outputFileName = bufA.name;

  const aTag = document.createElement('a');
  aTag.href = url;
  aTag.download = outputFileName;
  document.body.appendChild(aTag);
  aTag.click();
  document.body.removeChild(aTag);
  URL.revokeObjectURL(url);

  // Thông báo thành công
  let extra = '';
  if (modelA) {
    try {
      const paths = new Set();
      for (const i of diffOffsets) {
        const d = describeOffset(modelA, bufA.buf, i);
        if (d) paths.add(d.typeName + (d.fieldPath ? ' › ' + d.fieldPath : ''));
        if (paths.size > 30) break;
      }
      if (paths.size) {
        const list = [...paths].slice(0, 30).map(p => `<li>${p}</li>`).join('');
        extra = `<div class="msg warn" style="margin-top:10px">Các field/object đã bị ghi đè:<ul style="margin:6px 0 0 18px;padding:0">${list}</ul>${paths.size >= 30 ? '<div style="margin-top:4px">… và có thể còn nhiều hơn (đã giới hạn hiển thị).</div>' : ''}</div>`;
      }
    } catch (e) { /* không chặn tải file nếu bước mô tả field lỗi */ }
  }
  el('status').innerHTML += `<div class="msg ok" style="margin-top:10px">đã tạo thành công ${patchedCount.toLocaleString('vi-VN')} byte ! File mới đã được tải xuống với tên File A: <b>${outputFileName}</b></div>${extra}`;
}
</script>
