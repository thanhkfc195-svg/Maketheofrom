<script>

// Bắt mọi lỗi JS/Promise chưa xử lý và hiện ra màn hình, thay vì im lặng

window.addEventListener('error', e => {
  try {
    const box = document.getElementById('status');
    if (box) box.innerHTML = `<div class="msg bad">Lỗi JavaScript: ${String(e.message||e)}${e.filename?(' ('+e.filename+':'+e.lineno+')'):''}</div>` + box.innerHTML;
  } catch(_) {}
});
window.addEventListener('unhandledrejection', e => {
  try {
    const box = document.getElementById('status');
    if (box) box.innerHTML = `<div class="msg bad">Lỗi Promise: ${String(e.reason&&e.reason.message||e.reason)}</div>` + box.innerHTML;

});

const TARGET_PATH_IDS = ['-9165109095992080675', '2680591970127643204'];

let wasmCodec = { ready:false, lzma:null, error:null };

/* Codec WASM dạng CDN: chỉ là lớp giải mã/điều phối. Raw UnityFS phải dùng
   đúng payload của Unity, không được nhầm với container .xz/.lzma. */
async function initWasmCodec(){
  const box = el('wasmStatus');
  try {
    // Gọi import() gián tiếp qua new Function() để trình duyệt/WebView cũ
    // (không hỗ trợ cú pháp dynamic import) không bị lỗi PARSE toàn bộ script
    // — chỉ dòng này thất bại lúc chạy (runtime), không làm chết cả file JS.
    const dynImport = new Function('u', 'return import(u)');
    const mod = await dynImport('https://cdn.jsdelivr.net/npm/lzma-wasm@latest/dist/esm/index.js');
    if (typeof mod.initWasm === 'function') await mod.initWasm();
    wasmCodec = {ready:true, lzma:mod, error:null};
    box.className='msg ok';
    box.textContent='WASM CODEC: LZMA CDN đã sẵn sàng. Bản repack chỉ được bật sau khi codec và block layout được xác minh.';
  } catch(e) {
    wasmCodec = {ready:false, lzma:null, error:e};
    box.className='msg warn';
    box.textContent='WASM CODEC: không tải được từ CDN; giữ chế độ kiểm tra an toàn, không repack block nén.';
  }
}
initWasmCodec();

/* ═══════════ typetree reader ═══════════

   như bản gốc — không văng lỗi, không chặn luồng chính. */

class BinReader {
  constructor(buf){ this.buf = buf; this.view = new DataView(buf.buffer, buf.byteOffset, buf.byteLength); this.pos = 0; this.le = false; }
  align(n){ const r = this.pos % n; if (r) this.pos += (n - r); }
  u8(){ const v = this.view.getUint8(this.pos); this.pos += 1; return v; }
  u16(){ const v = this.view.getUint16(this.pos, this.le); this.pos += 2; return v; }
  i16(){ const v = this.view.getInt16(this.pos, this.le); this.pos += 2; return v; }
  u32(){ const v = this.view.getUint32(this.pos, this.le); this.pos += 4; return v; }
  i32(){ const v = this.view.getInt32(this.pos, this.le); this.pos += 4; return v; }
  u64(){ const v = this.view.getBigUint64(this.pos, this.le); this.pos += 8; return v; }
  i64(){ const v = this.view.getBigInt64(this.pos, this.le); this.pos += 8; return v; }
  skip(n){ this.pos += n; }
  bytes(n){ const v = this.buf.subarray(this.pos, this.pos + n); this.pos += n; return v; }
  cstr(){ let s = this.pos; while (this.buf[s] !== 0) s++; const str = new TextDecoder().decode(this.buf.subarray(this.pos, s)); this.pos = s + 1; return str; }

  try {
    if (!f || typeof f.arrayBuffer !== 'function') throw new Error('File không hợp lệ');
    const buf = new Uint8Array(await f.arrayBuffer());
    if (serial !== loadSerial) return;
    if (!buf.length) throw new Error('File rỗng');
    if (slot === 'A') bufA = { buf, name: f.name || 'file-A' }; else bufB = { buf, name: f.name || 'file-B' };
    el(labelId).textContent = `${f.name || 'file'} — ${buf.length.toLocaleString('vi-VN')} byte`;
    comparisonReady = false; unitySafety = null; pathOnlyMode = false; scopedCompareMeta = null; scopedFieldDiffs = [];
      diffOffsets = []; diffOffsetsB = []; diffPairs = []; analysisBufA = null; analysisBufB = null; analysisOffsetA = 0; analysisOffsetB = 0; scopedMode = 'pathid'; scopedObjectIds = [];
    el('patchBtn').disabled = true;
    el('patchBtn').textContent = 'Tạo & Tải File Mới';
    const state = `${bufA ? 'A✓' : 'A—'} ${bufB ? 'B✓' : 'B—'}`;
    el('status').innerHTML = `<div class="msg warn">Đã nạp File ${slot} (${state}). Hãy bấm So sánh 2 File để kiểm tra UnityFS trước khi patch.</div>`;
    el('result').innerHTML = '';
    el('runBtn').disabled = false;
  } catch(e) { el('status').innerHTML = `<div class="msg bad">Không thể đọc file: ${esc(e.message)}</div>`; }
}

el('runBtn').addEventListener('click', async () => {
  try {
    // Safari đôi khi cập nhật input.files trước khi callback change hoàn tất.
    // Đồng bộ lại một lần ngay lúc bấm nút để không bị trạng thái giả A/B.
    const fa=el('fileA').files && el('fileA').files[0];
    const fb=el('fileB').files && el('fileB').files[0];
    if(!bufA && fa) await loadFile(fa,'A','labelA');
    if(!bufB && fb) await loadFile(fb,'B','labelB');
    if(!bufA || !bufB){
      el('status').innerHTML=`<div class="msg warn">Chưa đủ hai file. Trạng thái hiện tại: ${bufA?'File A✓':'File A—'} / ${bufB?'File B✓':'File B—'}. Hãy chọn lại ô còn thiếu.</div>`;
      return;
    }
    runDiff();
  } catch(e) { el('status').innerHTML=`<div class="msg bad">Không thể bắt đầu so sánh: ${esc(e.message)}</div>`; }
});
el('patchBtn').addEventListener('click', generatePatchedFile);

function serializedHeaderHint(buf, off, limit) {
  if (!buf || off < 0 || off + 20 > limit) return false;
  try {
    const v = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    const version = v.getUint32(off + 8, false);
    if (version < 6 || version > 30) return false;
    if (version < 22) {
      const metadataSize = v.getUint32(off, false);
      if (!metadataSize || metadataSize > 128 * 1024 * 1024) return false;
      const fileSize = v.getUint32(off + 4, false);
      const dataOffset = v.getUint32(off + 12, false);
      return fileSize >= dataOffset && dataOffset >= 20 && off + fileSize <= limit;
    }
    // Unity v22+ giữ header cũ với metadata/fileSize bằng 0 rồi đặt
    // metadataSize, fileSize và dataOffset thật ở vùng header mở rộng.
    if (off + 48 > limit) return false;
    const metadataSize = v.getUint32(off + 20, false);
    const fileSize = v.getBigUint64(off + 24, false);
    const dataOffset = v.getBigUint64(off + 32, false);
    return metadataSize > 0 && metadataSize <= 128 * 1024 * 1024 &&
      fileSize >= dataOffset && dataOffset >= 48 &&
      fileSize <= BigInt(limit - off);
  } catch (_) { return false; }
}

function findSerializedFilesInNode(content, node, maxCandidates = 24) {
  const start = Math.max(0, Number(node.offset));
  const end = Math.min(content.length, start + Number(node.size));
  if (!Number.isSafeInteger(start) || !Number.isSafeInteger(end) || end - start < 20) return [];

  // SerializedFile thường bắt đầu ở offset 0/4/16; quét theo byte để xử lý
  // cả node có prefix hoặc padding không chuẩn. Giới hạn 8 MiB/node để tránh
  // làm trình duyệt bị nghẽn bởi node dữ liệu không phải asset.
  const scanEnd = Math.min(end, start + 8 * 1024 * 1024);
  const found = [];
  for (let off = start; off + 20 <= scanEnd && found.length < maxCandidates; off++) {
    if (!serializedHeaderHint(content, off, end)) continue;
    const candidate = content.subarray(off, end);
    const model = safeParseUnity(candidate);
    if (model && model.objects && model.objects.length) {
      found.push({ model, buf: candidate, offset: off, node });
      // Không thử lại các vị trí nằm bên trong SerializedFile vừa nhận diện.
      // Điều này vừa nhanh hơn vừa tránh bắt nhầm số liệu header như một file mới.
      const declared = model.header.fileSize;
      if (Number.isSafeInteger(declared) && declared > 0) off = Math.max(off, Math.min(scanEnd - 1, off + declared - 1));
    }
  }
  return found;
}

function chooseBestSerializedCandidate(candidates) {
  if (!candidates.length) return null;
  const score = item => {
    const ids = new Set(item.model.objects.map(o => o.pathId.toString()));
    const hits = TARGET_PATH_IDS.reduce((n, id) => n + (ids.has(id) ? 1 : 0), 0);
    const hasTree = item.model.objects.some(o => o.type && o.type.nodes && o.type.nodes.length) ? 1 : 0;
    return hits * 1000000000 + hasTree * 1000000 + Math.min(item.model.objects.length, 999999);
  };
  return candidates.sort((a, b) => score(b) - score(a))[0];
}

function inspectSerializedSource(fileBuf) {
  const direct = safeParseUnity(fileBuf);
  if (direct) return { model: direct, buf: fileBuf, source: 'SerializedFile trực tiếp', node: null };

  const bundle = parseUnityFS(fileBuf);
  if (!bundle || bundle.blockLayoutStatus !== 'known') return { model: null, buf: fileBuf, source: 'Không nhận diện được SerializedFile/UnityFS', node: null, bundle };
  try {
    const content = decodeUnityFSContent(bundle);
    const nodes = [...(bundle.blockLayout.nodes || [])].sort((x, y) => x.offset - y.offset);
    const candidates = [];
    for (const node of nodes) {
      if (!Number.isSafeInteger(node.offset) || !Number.isSafeInteger(node.size) || node.size < 20) continue;
      if (node.offset < 0 || node.offset + node.size > content.length) continue;
      candidates.push(...findSerializedFilesInNode(content, node));
    }
    // Một số bundle có node offset tương đối hoặc có prefix không được mô tả
    // chuẩn trong block-info. Dò thêm toàn vùng giải nén để không bỏ sót asset.
    if (!candidates.length) candidates.push(...findSerializedFilesInNode(content, { offset: 0, size: content.length, name: '<all-content>' }));
    const found = chooseBestSerializedCandidate(candidates);
    if (found) {
      return { model: found.model, buf: found.buf, source: 'SerializedFile trong UnityFS node ' + found.node.name + (found.offset !== found.node.offset ? ' (offset +' + (found.offset - found.node.offset) + ')' : ''), node: found.node, bundle };
    }
    return { model: null, buf: content, source: 'UnityFS đã giải nén nhưng không tìm thấy SerializedFile trong các node', node: null, bundle };
  } catch (e) {
    return { model: null, buf: fileBuf, source: 'UnityFS chưa giải nén được: ' + (e.message || e), node: null, bundle };
  }
}

function compareObjectSet(bufA2, modelA2, bufB2, modelB2, selector) {
  const result = { available: !!(bufA2 && bufB2 && modelA2 && modelB2), aOffsets: [], bOffsets: [], pairs: [], objectPairs: [], fieldDiffs: [], objectSizeDiffs: [], missing: [], comparedBytes: 0, patchableCount: 0, selectedObjectIds: [] };
  if (!result.available) return result;
  const byPath = model => new Map(model.objects.filter(selector).map(o => [o.pathId.toString(), o]));
  const objectsA = byPath(modelA2), objectsB = byPath(modelB2);
  const ids = [...new Set([...objectsA.keys(), ...objectsB.keys()])];
  result.selectedObjectIds = ids;
  result.available = ids.length > 0;
  if (!result.available) return result;
  for (const pathId of ids) {
    const oa = objectsA.get(pathId), ob = objectsB.get(pathId);
    if (!oa || !ob) { result.missing.push({ pathId, side: !oa ? 'A' : 'B' }); continue; }
    result.objectPairs.push({ id: pathId, oa, ob });
    const aSize = Math.max(0, Math.min(oa.byteSize, bufA2.length - oa.byteStart));
    const bSize = Math.max(0, Math.min(ob.byteSize, bufB2.length - ob.byteStart));
    const common = Math.min(aSize, bSize);
    result.comparedBytes += common;
    if (aSize === bSize) result.patchableCount++;
    for (let i = 0; i < common; i++) {
      const ap = oa.byteStart + i, bp = ob.byteStart + i;
      if (bufA2[ap] !== bufB2[bp]) {
        result.aOffsets.push(ap); result.bOffsets.push(bp); result.pairs.push({ a: ap, b: bp, pathId });
      }
    }
    if (aSize !== bSize) result.objectSizeDiffs.push({ pathId, aSize, bSize });
  }
  result.pairs.sort((x, y) => x.a - y.a);
  result.aOffsets = result.pairs.map(p => p.a);
  result.bOffsets = result.pairs.map(p => p.b);
  const seenFields = new Set();
  for (const pair of result.pairs) {
    const d = describeOffset(modelA2, bufA2, pair.a) || describeOffset(modelB2, bufB2, pair.b);
    if (!d) continue;
    const key = d.pathId + '|' + (d.fieldPath || d.typeName);
    if (!seenFields.has(key)) { seenFields.add(key); result.fieldDiffs.push(d); }
  }
  return result;
}

function compareTargetPathObjects(bufA2, modelA2, bufB2, modelB2) {
  return compareObjectSet(bufA2, modelA2, bufB2, modelB2, o => TARGET_PATH_SET.has(o.pathId.toString()));
}

function compareCacheObjectTypes(bufA2, modelA2, bufB2, modelB2) {
  return compareObjectSet(bufA2, modelA2, bufB2, modelB2, o => CACHE_CLASS_IDS.has(o.classID));
}

// Tự ghép object khi hai file không dùng cùng PathID cố định. Ưu tiên ClassID,
// tên type và thứ tự xuất hiện; PathID chỉ là thông tin phụ để hiển thị.
function compareAutoObjects(bufA2, modelA2, bufB2, modelB2) {
  const result = { available: !!(bufA2 && bufB2 && modelA2 && modelB2), aOffsets: [], bOffsets: [], pairs: [], objectPairs: [], fieldDiffs: [], objectSizeDiffs: [], missing: [], comparedBytes: 0, patchableCount: 0, selectedObjectIds: [] };
  if (!result.available) return result;
  const key = o => String(o.classID) + '|' + String((o.type && (o.type.name || o.type.className)) || CLASS_NAMES[o.classID] || 'ClassID_' + o.classID);
  const groups = m => { const g = new Map(); for (const o of m.objects) { const k = key(o); if (!g.has(k)) g.set(k, []); g.get(k).push(o); } return g; };
  const ga = groups(modelA2), gb = groups(modelB2);
  const keys = [...new Set([...ga.keys(), ...gb.keys()])];
  for (const k of keys) {
    const aa = ga.get(k) || [], bb = gb.get(k) || [], n = Math.max(aa.length, bb.length);
    for (let i=0; i<n; i++) {
      const oa=aa[i], ob=bb[i], id='auto:' + k + ':' + i;
      result.selectedObjectIds.push(id);
      if (!oa || !ob) { result.missing.push({pathId:id, side:!oa?'A':'B'}); continue; }
      result.objectPairs.push({id,oa,ob});
      const aSize=Math.max(0,Math.min(oa.byteSize,bufA2.length-oa.byteStart));
      const bSize=Math.max(0,Math.min(ob.byteSize,bufB2.length-ob.byteStart));
      const common=Math.min(aSize,bSize); result.comparedBytes+=common; if(aSize===bSize) result.patchableCount++;
      for(let j=0;j<common;j++){const ap=oa.byteStart+j,bp=ob.byteStart+j;if(bufA2[ap]!==bufB2[bp]){result.aOffsets.push(ap);result.bOffsets.push(bp);result.pairs.push({a:ap,b:bp,pathId:id});}}
      if(aSize!==bSize) result.objectSizeDiffs.push({pathId:id,aSize,bSize});
    }
  }
  result.available=result.objectPairs.length>0;
  result.pairs.sort((x,y)=>x.a-y.a); result.aOffsets=result.pairs.map(p=>p.a); result.bOffsets=result.pairs.map(p=>p.b);
  const seen=new Set(); for(const p of result.pairs){const d=describeOffset(modelA2,bufA2,p.a)||describeOffset(modelB2,bufB2,p.b);if(d){const k=d.pathId+'|'+(d.fieldPath||d.typeName);if(!seen.has(k)){seen.add(k);result.fieldDiffs.push(d);}}}
  return result;
}

function pathScopedPatchSupported() {
  if (!pathOnlyMode || !scopedCompareMeta || !scopedCompareMeta.available || !scopedCompareMeta.pairs.length || scopedCompareMeta.missing.length) return false;
  if (unitySafety && unitySafety.mode === 'unityfs') {
    const ua = unitySafety.ua;
    if (!ua || ua.blockLayoutStatus !== 'known' || !Number.isSafeInteger(ua.dataOffset)) return false;
    // Với bundle thật của bạn, content block có flag 0x40: block data không nén,
    // còn 0x243 chỉ nói block-info dùng LZ4HC. Giữ nguyên block layout nên có thể
    // thay content đã giải nén trực tiếp mà không làm hỏng bundle A.
    return ua.blockLayout.blocks.every(b => (b.flags & 0x3f) === 0);
  }
  return !!(analysisBufA && analysisBufB);
}

function runDiff() {
  if (!bufA || !bufB) {
    el('status').innerHTML='<div class="msg warn">Vui lòng chọn đủ File Gốc và File Mod trước khi so sánh.</div>';
    return;
  }
  const a = bufA.buf, b = bufB.buf;
  unitySafety = evaluateUnitySafety(bufA, bufB);
  comparisonReady = true;
  // Luôn chạy phép so sánh byte bình thường trước. Fallback PathID chỉ được
  // bật sau khi phép bình thường không đủ điều kiện và cả hai object mục tiêu
  // đã được xác nhận ở hai phía.
  pathOnlyMode = false;
  scopedMode = 'pathid';
  scopedObjectIds = [];
  const sourceA = inspectSerializedSource(a);
  const sourceB = inspectSerializedSource(b);
  modelA = sourceA.model;
  modelB = sourceB.model;
  analysisBufA = sourceA.buf;
  analysisBufB = sourceB.buf;
  analysisOffsetA = Number(sourceA.offset || 0);
  analysisOffsetB = Number(sourceB.offset || 0);

  const minLen = Math.min(a.length, b.length);
  const normalDiffOffsets = [], normalDiffPairs = [];
  let normalFirstDiff = -1;
  for (let i = 0; i < minLen; i++) {
    if (a[i] !== b[i]) {
      normalDiffOffsets.push(i); normalDiffPairs.push({ a: i, b: i });
      if (normalFirstDiff < 0) normalFirstDiff = i;
    }
  }
  const sizeDiff = a.length - b.length;
  const normalCanRun = unitySafety.mode === 'unityfs' ? unitySafety.safe : a.length === b.length;

  diffOffsets = normalDiffOffsets;
  diffOffsetsB = normalDiffOffsets.slice();
  diffPairs = normalDiffPairs;
  scopedFieldDiffs = [];
  scopedCompareMeta = null;
  let firstDiff = normalFirstDiff;
  let fallbackAttempted = false;
  let fallbackAvailable = false;
  if (!normalCanRun) {
    fallbackAttempted = true;
    const cacheName = ((bufA && bufA.name) + ' ' + (bufB && bufB.name)).toLowerCase();
    const cacheCandidate = compareCacheObjectTypes(analysisBufA, modelA, analysisBufB, modelB);
    const autoCandidate = compareAutoObjects(analysisBufA, modelA, analysisBufB, modelB);
    const namedCacheCandidate = /cache[_-]?res|cache/.test(cacheName) && cacheCandidate.available ? cacheCandidate : { available:false };
    const candidate = namedCacheCandidate.available ? namedCacheCandidate : (autoCandidate.available ? autoCandidate : compareTargetPathObjects(analysisBufA, modelA, analysisBufB, modelB));
    if (candidate.available) {
      pathOnlyMode = true;
      fallbackAvailable = true;
      scopedMode = namedCacheCandidate.available ? 'cache-types' : (autoCandidate.available ? 'auto-objects' : 'pathid');
      scopedObjectIds = candidate.selectedObjectIds || [];
      scopedCompareMeta = candidate;
      diffOffsets = candidate.aOffsets;
      diffOffsetsB = candidate.bOffsets;
      diffPairs = candidate.pairs;
      scopedFieldDiffs = candidate.fieldDiffs;
      firstDiff = diffOffsets.length ? diffOffsets[0] : -1;
    }
  }

  const scopedHasDifference = pathOnlyMode && scopedCompareMeta && (diffOffsets.length || scopedCompareMeta.objectSizeDiffs.length || scopedCompareMeta.missing.length);
  const identical = pathOnlyMode ? !!(scopedCompareMeta && scopedCompareMeta.available && !scopedHasDifference) : (diffOffsets.length === 0 && sizeDiff === 0);
  if (pathOnlyMode && scopedCompareMeta && scopedCompareMeta.available && firstDiff < 0) {
    const anchor = scopedMode === 'auto-objects' && scopedCompareMeta.objectPairs && scopedCompareMeta.objectPairs.length ? scopedCompareMeta.objectPairs[0].oa : modelA.objects.find(o => TARGET_PATH_SET.has(o.pathId.toString()));
    if (anchor) firstDiff = Math.max(0, anchor.byteStart);
  }

  let statusHtml;
  el('patchBtn').textContent = pathOnlyMode ? (scopedMode === 'cache-types' ? 'Tạo & Tải Patch Cache' : (scopedMode === 'auto-objects' ? 'Tạo & Tải Patch Tự Động' : 'Tạo & Tải Patch PathID')) : 'Tạo & Tải File Mới';
  if (fallbackAttempted && !fallbackAvailable) {
    statusHtml = `<div class="msg warn"><b>SO SÁNH BÌNH THƯỜNG</b><br>Phép diff byte bình thường chưa đủ điều kiện patch an toàn${sizeDiff !== 0 ? ` vì kích thước chênh ${Math.abs(sizeDiff).toLocaleString('vi-VN')} byte` : ''}. Đã thử fallback tự nhận diện object và hai PathID nhưng không tìm thấy đủ SerializedFile/object mục tiêu, nên đang giữ kết quả diff bình thường.</div>`;
    el('patchBtn').disabled = true;
  } else if (identical) {
    statusHtml = pathOnlyMode
      ? `<div class="msg ok"><b>${scopedMode === 'cache-types' ? 'CACHE OBJECT SCOPED' : (scopedMode === 'auto-objects' ? 'AUTO OBJECT SCOPED' : 'PATHID-SCOPED')} / KHÔNG KHÁC</b><br>${scopedMode === 'cache-types' ? 'Các object CapsuleCollider, GameObject và MonoBehaviour' : (scopedMode === 'auto-objects' ? 'Các object tự nhận diện' : 'Hai PathID mục tiêu')} không có thay đổi field nào trong phạm vi đã kiểm tra.</div>`
      : `<div class="msg ok">Hai file GIỐNG HỆT NHAU — Không có thông số nào thay đổi.</div>`;
    el('patchBtn').disabled = true;
  } else {
    statusHtml = pathOnlyMode
      ? `<div class="msg bad"><b>${scopedMode === 'cache-types' ? 'CACHE OBJECT SCOPED' : (scopedMode === 'auto-objects' ? 'AUTO OBJECT SCOPED' : 'PATHID-SCOPED')}</b> — File B lớn hơn File A nên chỉ so sánh ${scopedMode === 'cache-types' ? 'CapsuleCollider, GameObject và MonoBehaviour' : (scopedMode === 'auto-objects' ? 'các object tự nhận diện theo ClassID/type/thứ tự' : TARGET_PATH_IDS.map(esc).join(' và '))}. Phát hiện ${diffOffsets.length.toLocaleString('vi-VN')} byte khác biệt trong các object mục tiêu${scopedCompareMeta.objectSizeDiffs.length ? `; ${scopedCompareMeta.objectSizeDiffs.length} object khác kích thước` : ''}.</div>`
      : `<div class="msg bad">Phát hiện ${diffOffsets.length.toLocaleString('vi-VN')} byte khác biệt${sizeDiff !== 0 ? `, chênh lệch kích thước ${Math.abs(sizeDiff).toLocaleString('vi-VN')} byte` : ''}.</div>`;
    el('patchBtn').disabled = pathOnlyMode ? !pathScopedPatchSupported() : (!unitySafety.safe || (unitySafety.mode === 'unityfs' && !wasmCodec.ready && unitySafety.ua && unitySafety.ua.compression !== 'none'));
    if (pathOnlyMode) statusHtml += `<div class="msg ok"><b>AUTO OPTIMIZED ${scopedMode === 'cache-types' ? 'CACHE OBJECT' : (scopedMode === 'auto-objects' ? 'AUTO OBJECT' : 'PATHID')} PATCH</b> — Đã giới hạn phạm vi theo các object được nhận diện. Khi B lớn hơn A, tool sẽ chép phần byte chung của dữ liệu đã chọn vào đúng vị trí trong A, giữ nguyên kích thước và cấu trúc bundle gốc${scopedCompareMeta.objectSizeDiffs.length ? '; object khác kích thước sẽ không làm nút patch bị khóa' : ''}.</div>`;
    else if (unitySafety.safe) statusHtml += `<div class="msg ok">${unitySafety.mode === 'unityfs' ? 'UNITYFS / COMPATIBLE' : 'RAW PATCH / SAME SIZE'} — Có thể tạo file mới.</div>`;
    else statusHtml += `<div class="msg bad"><b>UNITYFS / UNSAFE RAW PATCH</b><br>Header hoặc block layout khác nhau; không patch byte-thô để tránh làm hỏng AssetBundle.<br>${unitySafety.reasons.map(esc).join(' · ')}</div>`;
  }
  if (unitySafety.mode === 'unityfs') {
    const cardClass = unitySafety.safe ? 'compatible' : 'unsafe';
    statusHtml += `<div class="unityfs-card ${cardClass}"><b>UNITYFS INSPECTION — FILE A</b>${unitySummary(unitySafety.ua)}<hr style="border-color:#292b62;border-width:1px 0 0;margin:12px 0"><b>UNITYFS INSPECTION — FILE B</b>${unitySummary(unitySafety.ub)}</div>`;
  }
  if (modelA) {
    const hasTree = modelA.objects.some(o => o.type && o.type.nodes && o.type.nodes.length);
    statusHtml += `<div class="msg warn">${esc(sourceA.source)} (version ${modelA.header.version}, ${modelA.objects.length.toLocaleString('vi-VN')} object). ${hasTree ? 'Có TypeTree — bảng bên dưới sẽ hiện tên field thật.' : 'Không có TypeTree nhúng sẵn — chỉ hiện theo Object/ClassID, không có tên field.'}</div>`;
  } else {
    statusHtml += `<div class="msg warn">${esc(sourceA.source)}.</div>`;
  }
  if (!pathOnlyMode && !fallbackAttempted) {
    statusHtml += `<div class="msg ok">Đang dùng chế độ so sánh bình thường: đối chiếu byte trực tiếp${normalCanRun ? ' và giữ nguyên khả năng tạo file khi cấu trúc tương thích.' : '.'}</div>`;
  }
  if (pathOnlyMode && scopedCompareMeta && scopedCompareMeta.available) {
    const selectedIds = scopedObjectIds.length ? scopedObjectIds : TARGET_PATH_IDS;
    const autoCount = scopedMode === 'auto-objects' && scopedCompareMeta.objectPairs ? scopedCompareMeta.objectPairs.length : 0;
    const foundA = scopedMode === 'auto-objects' ? autoCount : selectedIds.filter(id => modelA.objects.some(o => o.pathId.toString() === id)).length;
    const foundB = scopedMode === 'auto-objects' ? autoCount : selectedIds.filter(id => modelB.objects.some(o => o.pathId.toString() === id)).length;
    const totalShown = scopedMode === 'auto-objects' ? Math.max(scopedCompareMeta.selectedObjectIds.length, autoCount) : selectedIds.length;
    const scopeLabel = scopedMode === 'cache-types' ? 'CapsuleCollider, GameObject và MonoBehaviour' : (scopedMode === 'auto-objects' ? 'object tự nhận diện theo ClassID/type/thứ tự' : TARGET_PATH_IDS.map(esc).join('</b>, <b>'));
    statusHtml += `<div class="msg ok"><b>${scopedMode === 'cache-types' ? 'CACHE OBJECT SCOPED' : (scopedMode === 'auto-objects' ? 'AUTO OBJECT SCOPED' : 'PATHID SCOPED')}</b> — Đang quét ${scopeLabel}. Ghép được A: ${foundA}/${totalShown}, B: ${foundB}/${totalShown}; đã so sánh ${scopedCompareMeta.comparedBytes.toLocaleString('vi-VN')} byte object.</div>`;
    if (scopedCompareMeta.missing.length) statusHtml += `<div class="msg bad">Object không tồn tại ở một phía: ${scopedCompareMeta.missing.slice(0,20).map(x => esc(x.pathId) + ' thiếu ở File ' + x.side).join('; ')}${scopedCompareMeta.missing.length > 20 ? ' …' : ''}.</div>`;
  }
  el('status').innerHTML = statusHtml;

  if (pathOnlyMode && (!scopedCompareMeta || !scopedCompareMeta.available)) { el('result').innerHTML = ''; return; }
  if (identical) { el('result').innerHTML = ''; return; }

  const pctBase = pathOnlyMode ? (scopedCompareMeta.comparedBytes || 0) : minLen;
  const pctDiff = pctBase ? (diffOffsets.length / pctBase * 100) : 0;
  el('result').innerHTML = `
    <div class="stat-grid">
      <div class="stat ${diffOffsets.length ? 'bad' : ''}"><b>${diffOffsets.length.toLocaleString('vi-VN')}</b><span>Byte khác biệt</span></div>
      <div class="stat"><b>${firstDiff >= 0 ? '0x'+firstDiff.toString(16) : '—'}</b><span>${pathOnlyMode ? 'Offset A thay đổi đầu' : 'Offset thay đổi đầu'}</span></div>
      <div class="stat"><b>${pctDiff.toFixed(3)}%</b><span>${pathOnlyMode ? 'Tỉ lệ trong object mục tiêu' : 'Tỉ lệ thay đổi'}</span></div>
      <div class="stat"><b>${sizeDiff === 0 ? 'Bằng nhau' : (sizeDiff>0?'A > B':'B > A')}</b><span>Trạng thái size file</span></div>
    </div>

    <div class="panel">
      <h2>
        <span>${pathOnlyMode ? (scopedMode === 'cache-types' ? 'Hex tại object cache mục tiêu' : (scopedMode === 'auto-objects' ? 'Hex tại object tự nhận diện' : 'Hex tại PathID mục tiêu')) : 'Hex tại vùng thay đổi'}</span>
        <div class="nav" id="hexNav"></div>
      </h2>
      <div id="hexArea"></div>
    </div>

    <div class="panel">
      <h2>${pathOnlyMode ? (scopedMode === 'cache-types' ? 'Field thay đổi trong CapsuleCollider / GameObject / MonoBehaviour' : (scopedMode === 'auto-objects' ? 'Field thay đổi trong các object tự nhận diện' : 'Field thay đổi trong hai PathID mục tiêu')) : 'Danh sách các vùng thông số thay đổi (Sẽ được import từ B sang A)'}</h2>
      <table class="diffrows">
        <tr><th>Offset A (hex)</th><th>${pathOnlyMode ? 'Offset B (hex)' : 'Độ dài'}</th><th>${pathOnlyMode ? 'A' : 'Giá trị Gốc (A)'}</th><th>${pathOnlyMode ? 'B' : 'Giá trị Mới từ (B)'}</th><th>Field / Object</th></tr>
        <tbody id="diffRows"></tbody>
      </table>
    </div>
  `;

  renderRegions();
  renderHexAt(firstDiff);
}

function renderRegions() {
  const regions = [];
  let start = null, prev = null;
  for (const off of diffOffsets) {
    if (start === null) { start = off; prev = off; continue; }
    if (off === prev + 1) { prev = off; continue; }
    regions.push([start, prev]); start = off; prev = off;
  }
  if (start !== null) regions.push([start, prev]);

  const MAX_ROWS = 200;
  const rows = regions.slice(0, MAX_ROWS).map(([s,e]) => {
    const len = e - s + 1;
    const pair = diffPairs.find(p => p.a === s) || { a:s, b:s };
    const bStart = pathOnlyMode ? pair.b : s;
    const aBuf = analysisBufA || bufA.buf;
    const bBuf = analysisBufB || bufB.buf;
    const a = bytesToHex(aBuf.subarray(s, Math.min(e+1, s+8)));
    const b = bytesToHex(bBuf.subarray(bStart, Math.min(bBuf.length, bStart+8)));
    let fieldCell = '<span class="off">—</span>';
    const desc = modelA ? describeOffset(modelA, aBuf, s) : null;
    if (desc) {
      fieldCell = `<span title="PathID ${desc.pathId}">${desc.typeName}${desc.fieldPath ? ' › ' + desc.fieldPath : ''}</span>`;
    }
    const bLabel = pathOnlyMode ? `0x${bStart.toString(16).padStart(8,'0')}` : `${len} byte`;
    return `<tr onclick="renderHexAt(${s})" style="cursor:pointer">
      <td class="off">0x${s.toString(16).padStart(8,'0')}</td>
      <td class="off">${bLabel}</td>
      <td class="hex-a">${a}${len>8?' …':''}</td>
      <td class="hex-b">${b}${len>8?' …':''}</td>
      <td>${fieldCell}</td>
    </tr>`;
  }).join('');
  el('diffRows').innerHTML = rows + (regions.length > MAX_ROWS ? `<tr><td colspan="5" class="off">… và ${regions.length - MAX_ROWS} vùng khác</td></tr>` : '');
}

function bytesToHex(arr) {
  return Array.from(arr).map(b => b.toString(16).padStart(2,'0')).join(' ');
}

let hexCenter = 0;
function renderHexAt(offset) {
  hexCenter = offset;
  const WINDOW = 256;
  const pair = diffPairs.find(p => p.a === offset) || { a:offset, b:offset };
  const bOffset = pathOnlyMode ? pair.b : offset;
  const startA = Math.max(0, offset - 64);
  const startB = Math.max(0, bOffset - 64);
  const aBuf = analysisBufA || bufA.buf;
  const bBuf = analysisBufB || bufB.buf;
  el('hexArea').innerHTML = `<div class="hexview">
    <div><div style="color:var(--muted);font:11px var(--mono);margin-bottom:6px">FILE A (Gốc) — ${esc(bufA.name)}${pathOnlyMode?' / SerializedFile đã chọn':''}</div><div class="hexbox" id="hexA"></div></div>
    <div><div style="color:var(--muted);font:11px var(--mono);margin-bottom:6px">FILE B (Nguồn Mod) — ${esc(bufB.name)}${pathOnlyMode?' / SerializedFile đã chọn':''}</div><div class="hexbox" id="hexB"></div></div>
  </div>`;
  renderHexBox('hexA', aBuf, startA, WINDOW, diffOffsets);
  renderHexBox('hexB', bBuf, startB, WINDOW, diffOffsetsB);
  el('hexNav').innerHTML = `<span>offset A 0x${offset.toString(16)}${pathOnlyMode?' · offset B 0x'+bOffset.toString(16):''}</span>`;
}

function renderHexBox(id, buf, start, windowLen, offsets = diffOffsets) {
  const diffSet = new Set(offsets);
  let html = '';
  for (let row = start; row < Math.min(buf.length, start + windowLen); row += 16) {
    let line = `<span class="addr">${row.toString(16).padStart(8,'0')}</span> `;
    for (let i = 0; i < 16; i++) {
      const p = row + i;
      if (p >= buf.length) { line += `<span class="byte">  </span> `; continue; }
      const isDiff = diffSet.has(p);
      line += `<span class="byte${isDiff?' diff':''}">${buf[p].toString(16).padStart(2,'0')}</span> `;
    }
    html += `<div class="row">${line}</div>`;
  }
  el(id).innerHTML = html;
}

function startBlobDownload(bytes, outputFileName) {
  const blob = new Blob([bytes], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const aTag = document.createElement('a');
  aTag.href = url;
  aTag.download = outputFileName.replace(/[\\\\/:*?"<>|]/g, '_');
  aTag.rel = 'noopener';
  aTag.style.display = 'none';
  document.body.appendChild(aTag);
  aTag.click();
  document.body.removeChild(aTag);
  // Giữ URL đủ lâu cho Cốc Cốc/Chromium hoàn tất stream tải xuống.
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return { url, fileName: aTag.download };
}

function appendRetryDownload(bytes, outputFileName) {
  const retry = document.createElement('a');
  retry.href = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
  retry.download = outputFileName.replace(/[\\\\/:*?"<>|]/g, '_');
  retry.rel = 'noopener';
  retry.textContent = '  [Bấm vào đây để tải lại]';
  retry.style.cssText = 'color:#35f2ff;text-decoration:underline;font-weight:700;margin-left:8px;cursor:pointer';
  el('status').appendChild(retry);
}

function downloadOutputBuffer(bytes, message, extra='') {
  const outputFileName = bufA.name;
  startBlobDownload(bytes, outputFileName);
  el('status').innerHTML += `<div class="msg ok" style="margin-top:10px">${message} <b>${esc(outputFileName)}</b></div>${extra}`;
  appendRetryDownload(bytes, outputFileName);
}

function buildPathScopedPatchedBuffer() {
    if (!pathScopedPatchSupported()) throw new Error('các object đã chọn chưa đủ điều kiện patch an toàn (thiếu object, khác kích thước hoặc content block đang nén)');
  let output;
  const copied = [];
    const objectPairs = scopedCompareMeta && scopedCompareMeta.objectPairs && scopedCompareMeta.objectPairs.length
      ? scopedCompareMeta.objectPairs
      : (scopedObjectIds.length ? scopedObjectIds : TARGET_PATH_IDS).map(id => ({ id, oa:modelA.objects.find(o => o.pathId.toString() === id), ob:modelB.objects.find(o => o.pathId.toString() === id) })).filter(x => x.oa && x.ob);
    if (!objectPairs.length) throw new Error('Không có cặp object A/B tương ứng để patch');
    if (unitySafety && unitySafety.mode === 'unityfs') {
      const rawA = decodeUnityFSContent(unitySafety.ua);
      const rawB = decodeUnityFSContent(unitySafety.ub);
      for (const item of objectPairs) {
      const pathId = item.id, oa = item.oa, ob = item.ob;
      const src = analysisOffsetB + ob.byteStart, dst = analysisOffsetA + oa.byteStart;
      const common = Math.min(oa.byteSize, ob.byteSize);
      if (common <= 0 || src < 0 || dst < 0 || src + common > rawB.length || dst + common > rawA.length) throw new Error('Object PathID ' + pathId + ' nằm ngoài content hoặc không có byte chung');
      rawA.set(rawB.subarray(src, src + common), dst);
      copied.push(pathId + ' (' + common.toLocaleString('vi-VN') + '/' + oa.byteSize.toLocaleString('vi-VN') + ' byte A; lấy từ B)');
    }
    output = new Uint8Array(bufA.buf);
    let src = unitySafety.ua.dataOffset, dst = 0;
    for (const block of unitySafety.ua.blockLayout.blocks) {
      if ((block.flags & 0x3f) !== 0 || block.uncompressedSize !== block.compressedSize || src + block.compressedSize > output.length) throw new Error('Bundle A không còn là content block không nén');
      output.set(rawA.subarray(dst, dst + block.uncompressedSize), src);
      src += block.compressedSize; dst += block.uncompressedSize;
    }
    } else {
      output = new Uint8Array(bufA.buf);
      for (const item of objectPairs) {
      const pathId = item.id, oa = item.oa, ob = item.ob;
      const src = analysisOffsetB + ob.byteStart, dst = analysisOffsetA + oa.byteStart;
      const common = Math.min(oa.byteSize, ob.byteSize);
      if (common <= 0 || src < 0 || dst < 0 || src + common > analysisBufB.length || dst + common > output.length) throw new Error('Object PathID ' + pathId + ' nằm ngoài buffer hoặc không có byte chung');
      output.set(analysisBufB.subarray(src, src + common), dst);
      copied.push(pathId + ' (' + common.toLocaleString('vi-VN') + '/' + oa.byteSize.toLocaleString('vi-VN') + ' byte A; lấy từ B)');
    }
  }
  return { output, copied };
}

function generatePathScopedPatchedFile() {
  try {
    const result = buildPathScopedPatchedBuffer();
    downloadOutputBuffer(result.output, 'Đã tạo file mới bằng AUTO OPTIMIZED ' + (scopedMode === 'cache-types' ? 'CACHE OBJECT PATCH' : (scopedMode === 'auto-objects' ? 'AUTO OBJECT PATCH' : 'PATHID PATCH')) + ': ' + result.copied.join('; ') + '. File đã được tải xuống với tên File A:');
  } catch (e) {
    el('status').innerHTML += `<div class="msg bad" style="margin-top:10px">Không thể tạo file patch theo ${scopedMode === 'cache-types' ? 'object cache' : (scopedMode === 'auto-objects' ? 'object tự nhận diện' : 'PathID')}: ${esc(e.message || e)}</div>`;
  }
}

const menuToggle = el('menuToggle');
const topMenu = el('topMenu');
const videoToggle = el('videoToggle');
const videoPanel = el('videoPanel');
const closeVideo = el('closeVideo');
function setQuickMenu(open) { topMenu.hidden = !open; menuToggle.setAttribute('aria-expanded', String(open)); }
function setVideo(open) { videoPanel.hidden = !open; videoToggle.setAttribute('aria-expanded', String(open)); if (open && typeof videoPanel.scrollIntoView === 'function') videoPanel.scrollIntoView({behavior:'smooth', block:'start'}); }
menuToggle.addEventListener('click', () => setQuickMenu(topMenu.hidden));
videoToggle.addEventListener('click', () => { setVideo(videoPanel.hidden); setQuickMenu(false); });
closeVideo.addEventListener('click', () => setVideo(false));
if (typeof topMenu.querySelectorAll === 'function') topMenu.querySelectorAll('[data-menu-close]').forEach(a => a.addEventListener('click', () => setQuickMenu(false)));

// Tính năng Patcher: Lấy dữ liệu từ file gốc A, chép đè các byte khác biệt từ file B và cho phép tải xuống
function generatePatchedFile() {
  if (pathOnlyMode) {
    generatePathScopedPatchedFile();
    return;
  }
  if (!bufA || !bufB || !comparisonReady || !unitySafety || !unitySafety.safe) {
    el('status').innerHTML += '<div class="msg bad" style="margin-top:10px">Patch đã bị khóa vì hai file chưa được xác minh là tương thích.</div>';
    return;
  }
  if (bufA.buf.length !== bufB.buf.length) {
    el('status').innerHTML += '<div class="msg bad" style="margin-top:10px">Patch bị hủy: kích thước file khác nhau.</div>';
    return;
  }

  // Clone lại buffer của file gốc A để giữ nguyên toàn bộ cấu trúc gốc
  const newBuf = new Uint8Array(bufA.buf);
  
  // Chép đè (patch) tất cả các byte từ file B sang file A dựa trên mảng vị trí khác biệt đã check
  let patchedCount = 0;
  for (const i of diffOffsets) {
    if (i < newBuf.length && i < bufB.buf.length) {
      newBuf[i] = bufB.buf[i];
      patchedCount++;
    }
  }

  // Xử lý trường hợp file B dài hơn file A (nếu có phần dư thừa ở đuôi)
  // Tạo Blob và kích hoạt tải xuống tự động
  const blob = new Blob([newBuf], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  
  // Tên tải xuống giữ nguyên tuyệt đối tên của File A (File Gốc).
  const outputFileName = bufA.name;

  const aTag = document.createElement('a');
  aTag.href = url;
  aTag.download = outputFileName.replace(/[\\/:*?"<>|]/g, "_");
  aTag.rel = 'noopener';
  document.body.appendChild(aTag);
  aTag.click();
  document.body.removeChild(aTag);
  setTimeout(() => URL.revokeObjectURL(url), 2000);

  // Thông báo thành công
  let extra = '';
  if (modelA) {
    try {
      const paths = new Set();
      const descBuf = analysisBufA || bufA.buf;
      for (const i of diffOffsets) {
        const d = describeOffset(modelA, descBuf, i);
        if (d) paths.add(d.typeName + (d.fieldPath ? ' › ' + d.fieldPath : ''));
        if (paths.size > 30) break;
      }
      if (paths.size) {
        const list = [...paths].slice(0, 30).map(p => `<li>${p}</li>`).join('');
        extra = `<div class="msg warn" style="margin-top:10px">Các field/object đã bị ghi đè:<ul style="margin:6px 0 0 18px;padding:0">${list}</ul>${paths.size >= 30 ? '<div style="margin-top:4px">… và có thể còn nhiều hơn (đã giới hạn hiển thị).</div>' : ''}</div>`;
      }
    } catch (e) { /* không chặn tải file nếu bước mô tả field lỗi */ }
  }
  el('status').innerHTML += `<div class="msg ok" style="margin-top:10px">đã tạo thành công ${patchedCount.toLocaleString('vi-VN')} byte ! File mới đã được tải xuống với tên File A: <b>${outputFileName}</b></div>${extra}`;
}
</script>
